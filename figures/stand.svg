<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 540" width="1050" height="540">
  <!-- The HGBP test stand: a decluttered copy of the web UI schematic (same geometry). -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #e6edf3; }
    text.lbl { font-size: 12px; fill: #8b98a5; }
    text.port { font-size: 11px; fill: #8b98a5; }
    .pipe { stroke-width: 4; fill: none; }
    .hot { stroke: #ef5350; } .liq { stroke: #42a5f5; } .suc { stroke: #66bb6a; } .water { stroke: #26c6da; stroke-width: 3; }
    .vessel { fill: #1c262e; stroke: #90a4ae; stroke-width: 2; }
    .liquid { fill: #1e88e5; opacity: 0.75; }
    .valve { fill: none; stroke: #cfd8dc; stroke-width: 1.5; }
    .act { fill: #cfd8dc; }
    .stem { stroke: #cfd8dc; stroke-width: 2; }
    .comp { fill: #263238; stroke: #3ddc84; stroke-width: 2; }
    .probe { fill: #263238; stroke: #cfd8dc; stroke-width: 1.5; }
  </style>
  <defs>
    <!-- pipes end at the valve faces -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="540">
      <rect width="1000" height="540" fill="white" />
      <rect x="104" y="112" width="12" height="26" fill="black" />
      <rect x="364" y="112" width="12" height="26" fill="black" />
      <rect x="597" y="154" width="26" height="12" fill="black" />
      <rect x="924" y="307" width="12" height="26" fill="black" />
    </mask>
    <clipPath id="recClip"><rect x="747" y="232" width="56" height="156" rx="28" ry="16" /></clipPath>
  </defs>
  <rect width="1050" height="540" rx="12" fill="#171d24" />
  <g transform="translate(50,0)">

  <g mask="url(#cut)">
    <!-- discharge: compressor -> valve 1 -> hot gas header -> condenser -->
    <polyline class="pipe hot" points="110,212 110,60 775,60 775,95" />
    <!-- cooling water -->
    <polyline class="pipe water" points="930,470 930,157 860,157" />
    <polyline class="pipe water" points="860,113 930,113 930,80" />
    <!-- condensate drain; liquid line: receiver -> valve 3 -> mixing exchanger S3 -->
    <line class="pipe liq" x1="775" y1="175" x2="775" y2="238" />
    <polyline class="pipe liq" points="755,376 660,376 660,160 532,160 532,205" />
    <!-- bypass: header -> valve 2 -> mixing exchanger S1 -->
    <polyline class="pipe hot" points="370,60 370,410 458,410 458,380" />
    <!-- exchanger outlets -> tee -> suction line -> compressor -->
    <path class="pipe suc" d="M 458,205 V 180 H 377 A 7 7 0 0 0 363,180 H 280 V 440" />
    <polyline class="pipe suc" points="532,380 532,440 280,440" />
    <polyline class="pipe suc" points="280,440 110,440 110,288" />
  </g>

  <!-- valve 1 (vertical flow) -->
  <polygon class="valve" points="97,112 123,112 97,138 123,138" />
  <line class="stem" x1="110" y1="125" x2="132" y2="125" /><rect class="act" x="132" y="116" width="8" height="18" />
  <text x="148" y="122">1</text><text class="lbl" x="148" y="137">discharge pressure</text>
  <!-- valve 2 -->
  <polygon class="valve" points="357,112 383,112 357,138 383,138" />
  <line class="stem" x1="370" y1="125" x2="392" y2="125" /><rect class="act" x="392" y="116" width="8" height="18" />
  <text x="408" y="122">2</text><text class="lbl" x="408" y="137">suction pressure (hot gas bypass)</text>
  <!-- valve 3 (horizontal flow) -->
  <polygon class="valve" points="597,147 597,173 623,147 623,173" />
  <line class="stem" x1="610" y1="160" x2="610" y2="138" /><rect class="act" x="601" y="130" width="18" height="8" />
  <text x="596" y="192" text-anchor="middle">3</text><text class="lbl" x="596" y="207" text-anchor="middle">suction</text>
  <text class="lbl" x="596" y="221" text-anchor="middle">temperature</text>
  <!-- valve 4 -->
  <polygon class="valve" points="917,307 943,307 917,333 943,333" />
  <line class="stem" x1="930" y1="320" x2="908" y2="320" /><rect class="act" x="900" y="311" width="8" height="18" />
  <text x="892" y="317" text-anchor="end">4</text><text class="lbl" x="892" y="332" text-anchor="end">cooling water</text>

  <text class="lbl" x="560" y="48" text-anchor="middle">hot gas header</text>

  <!-- condenser -->
  <rect class="vessel" x="690" y="95" width="170" height="80" rx="6" />
  <text x="775" y="131" text-anchor="middle">condenser</text>
  <text class="lbl" x="775" y="148" text-anchor="middle">brazed plate</text>
  <text class="lbl" x="942" y="468">water in</text>
  <text class="lbl" x="930" y="72" text-anchor="middle">water out</text>

  <!-- receiver -->
  <rect class="vessel" x="745" y="230" width="60" height="160" rx="30" ry="18" />
  <rect class="liquid" x="745" y="324" width="60" height="64" clip-path="url(#recClip)" />
  <text x="815" y="252">receiver</text>
  <!-- liquid pressure transmitter -->
  <circle class="probe" cx="722" cy="376" r="6" />
  <text class="lbl" x="722" y="400" text-anchor="middle">liquid pressure</text>

  <!-- mixing exchanger: gas column (S1 bottom -> S2 top), quench column (S3 top -> S4 bottom) -->
  <rect class="vessel" x="440" y="205" width="110" height="175" rx="6" />
  <rect class="liquid" x="496" y="206" width="52" height="33" style="opacity:0.7" />
  <rect class="liquid" x="496" y="241" width="52" height="33" style="opacity:0.5" />
  <rect class="liquid" x="496" y="276" width="52" height="33" style="opacity:0.25" />
  <line x1="495" y1="209" x2="495" y2="376" stroke="#90a4ae" stroke-width="1" />
  <text class="lbl" x="467" y="297" text-anchor="middle">gas</text>
  <text class="lbl" x="522" y="340" text-anchor="middle">quench</text>
  <text class="port" x="450" y="393" text-anchor="end">S1</text>
  <text class="port" x="446" y="199" text-anchor="end">S2</text>
  <text class="port" x="542" y="199">S3</text>
  <text class="port" x="540" y="393">S4</text>
  <text x="562" y="282">mixing</text>
  <text x="562" y="298">exchanger</text>
  <text class="lbl" x="562" y="314">counterflow</text>

  <!-- tee, suction probe, discharge probe -->
  <circle cx="280" cy="440" r="5" fill="#66bb6a" />
  <text class="lbl" x="280" y="462" text-anchor="middle">tee</text>
  <text class="lbl" x="195" y="430" text-anchor="middle">suction line</text>
  <circle class="probe" cx="110" cy="316" r="6" />
  <text class="lbl" x="122" y="320">suction probe</text>
  <circle class="probe" cx="110" cy="184" r="6" />
  <text class="lbl" x="122" y="188">discharge probe</text>

  <!-- compressor -->
  <circle class="comp" cx="110" cy="250" r="38" />
  <path class="comp" style="fill:none" d="M 94.5,215.3 L 78.5,271.2 M 125.5,215.3 L 141.5,271.2" />
  <text x="62" y="254" text-anchor="end">compressor</text>

  <!-- legend -->
  <g transform="translate(-10,505)">
    <line class="pipe hot" x1="0" y1="0" x2="28" y2="0" /><text class="lbl" x="36" y="4">hot gas</text>
    <line class="pipe liq" x1="120" y1="0" x2="148" y2="0" /><text class="lbl" x="156" y="4">liquid / quench</text>
    <line class="pipe suc" x1="280" y1="0" x2="308" y2="0" /><text class="lbl" x="316" y="4">suction gas</text>
    <line class="pipe water" x1="420" y1="0" x2="448" y2="0" /><text class="lbl" x="456" y="4">cooling water</text>
  </g>
  </g>
</svg>
